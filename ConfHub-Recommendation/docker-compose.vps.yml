services:
  # --- 1. KAFKA SYSTEM ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    depends_on: [zookeeper]
    ports:
      - "${BIND_IP:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- 2. VECTOR ---
  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    depends_on: [kafka]
    volumes:
      - ./infrastructure/vector.toml:/etc/vector/vector.toml:ro
      - "../Easyconf-BE/logs:/var/log/external_app_logs:ro"
    command: ["--config", "/etc/vector/vector.toml"]

  redis:
    image: redis:7.2-alpine
    container_name: redis_storage
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:6380:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${BIND_IP:-127.0.0.1}:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # --- 3. PYTHON WORKER ---
  data-processor:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: ./data_processor
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - elasticsearch
      - kafka
    env_file:
      - .env
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      MONGO_URI: ${MONGO_URI}
      REDIS_HOST: ${REDIS_HOST}
      ES_HOST: ${ES_HOST}
    volumes:
      - ./recommendation_engine:/app/recommendation_engine

  recommendation-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: ./recommendation_engine
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - elasticsearch
    env_file:
      - .env
    networks:
      - default
      - confhub-network
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      ES_HOST: ${ES_HOST}
      NESTJS_API_URL: ${NESTJS_API_URL}
      RECOMMEND_CONFIG_API_URL: ${RECOMMEND_CONFIG_API_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AI_MODEL_CHANNELS: ${AI_MODEL_CHANNELS}
      AI_RETRAIN_COMMAND: ${AI_RETRAIN_COMMAND}
      PYTHONUNBUFFERED: 1
    command: ["python", "-u", "worker.py"]

  # --- 4. DATABASE ---
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data_storage:/data/db

volumes:
  mongo_data_storage:
  redis_data:
  es_data:

networks:
  confhub-network:
    external: true